apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
- apiGroups: [""]
  resources:
  - namespaces
  - pods
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read-binding
subjects:
- kind: ServiceAccount
  name: fluent-bit
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: fluent-bit-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: kube-system
data:
  # === ОСНОВНОЙ КОНФИГУРАЦИОННЫЙ ФАЙЛ ===
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/fluent-bit-*.log
        Parser            docker
        Docker_Mode       On
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    [FILTER]
        Name    grep
        Match   kube.*
        Regex   $kubernetes['namespace_name'] ^(for-painter)$

    [OUTPUT]
        Name   http
        Match  *
        Host   192.168.1.190
        Port   5044

    # # === НАСТРОЙКА ВЫВОДА ПОД ELASTICSEARCH 9.x ===
    # [OUTPUT]
    #     Name            es
    #     Match           *
    #     Host            192.168.1.190
    #     Port            9200
        
    #     # Форматирование под структуру Logstash (индексы вида k8s-logs-ГГГГ.ММ.ДД)
    #     Logstash_Format On
    #     Logstash_Prefix k8s-logs
        
    #     # КРИТИЧНО ДЛЯ 9.x: Полное отключение устаревших типов документов _type
    #     Suppress_Type_Name On

    #     # БЕЗОПАСНОСТЬ 9.x: Включаем HTTPS (включен в ELK 9 по умолчанию)
    #     tls             off
    #     # Выключаем верификацию, если ваш Elasticsearch работает на самоподписанных сертификатах
    #     tls.verify      Off
        
    #     # АВТОРИЗАЦИЯ: Укажите данные пользователя вашей инсталляции ELK 9
    #     HTTP_User       elastic
    #     HTTP_Passwd     MySecurePassword123
        
    #     # Защита от потери данных: бесконечные попытки переотправки при сбоях сети
    #     Retry_Limit     False

  # === КОНФИГУРАЦИЯ ПАРСЕРОВ ===
  parsers.conf: |
    # Базовый парсер контейнерной среды CRI / Docker
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    # Парсер стандартных логов Nginx
    [PARSER]
        Name        nginx
        Format      regex
        Regex       ^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$
        Time_Key    time
        Time_Format %d/%b/%Y:%H:%M:%S %z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: kube-system
  labels:
    k8s-app: fluent-bit-logging
spec:
  selector:
    matchLabels:
      name: fluent-bit
  template:
    metadata:
      labels:
        name: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:5.1.2
        imagePullPolicy: Always
        resources:
          limits:
            memory: 250Mi
          requests:
            cpu: 100m
            memory: 50Mi
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
