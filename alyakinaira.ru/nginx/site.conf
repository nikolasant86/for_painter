server {
    listen 80;
    server_name localhost; # Укажи здесь домен или IP сервера

    root /usr/share/nginx/html;
    index index.html;

    # Раздача статического фронтенда (главная, css, js)
    location / {
        try_files $uri $uri/ =404;
    }

    # 🌟 Перенаправляем динамические страницы книг (например: /project/terem-muhi) во Flask
    location /project/ {
        proxy_pass http://gallery:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🌟 Универсальный эндпоинт для API картинок
    location /api/ {
        proxy_pass http://gallery:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Перенаправляем запросы к картинкам во Flask
    location /media/ {
        proxy_pass http://gallery:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
