apiVersion: v1
kind: ConfigMap
metadata:
    namespace: for-painter
    name: nginx-config-for-painter
data:
    site.conf: |
        server {
            listen 80;
            server_name localhost alyakinaira.ru www.alyakinaira.ru;
            try_files $uri $uri/ =404;

            set_real_ip_from  192.168.1.1; 
            real_ip_header    X-Forwarded-For;
            real_ip_recursive on;

            root /usr/share/nginx/html;
            index index.html;

            location /project/ {
                proxy_pass http://gallery:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/ {
                proxy_pass http://gallery:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /media/ {
                proxy_pass http://gallery:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /app/media/nesessary/images/ {
                alias /usr/share/nginx/html/nesessary/images/;
                try_files $uri $uri/ =404;
            }
        }

