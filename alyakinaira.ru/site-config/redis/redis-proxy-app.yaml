apiVersion: apps/v1
kind: Deployment
metadata:
  name: gallery-proxy
  namespace: for-painter
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gallery-proxy
  template:
    metadata:
      labels:
        app: gallery-proxy
    spec:
      containers:
      - name: proxy
        image: nikolavasant/alyakinaira-redis-proxy:v1.0.0 
        imagePullPolicy: Always
        env:
        - name: ORIGINAL_BACKEND_URL
          value: "http://gallery:8000"
        - name: REDIS_HOST
          value: "redis-cache-service"
        - name: REDIS_PORT
          value: "6379"
        - name: PROXY_PORT
          value: "8001"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: redis-password
        ports:
        - containerPort: 8001
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"