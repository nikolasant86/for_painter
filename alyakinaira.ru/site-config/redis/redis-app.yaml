apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: for-painter
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      containers:
      - name: redis
        image: redis:8.8.4-alpine
        command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: redis-password
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1.5Gi"