apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-worker1
  namespace: ingress-nginx
  annotations:
    metallb.universe.tf/address-pool: pool-worker1
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: https
    port: 443
    targetPort: https
  selector:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: ingress-nginx
---
