apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: pool-worker1
  namespace: metallb-system
spec:
  addresses:
  - 192.168.1.210/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: adv-worker1
  namespace: metallb-system
spec:
  ipAddressPools:
  - pool-worker1
  nodeSelectors:
  - matchLabels:
      kubernetes.io/hostname: worker1
---
