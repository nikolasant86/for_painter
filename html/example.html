<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Терем Мухи</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        .gallery {
            max-width: 800px;
            margin: 20px auto;
            position: relative;
        }

        .gallery img {
            display: block;
            max-width: 100%;
            height: auto;
            transition: transform 0.3s ease;
        }

        .gallery:hover img {
            cursor: zoom-in;
        }

        .desc {
            text-align: center;
            font-size: 16px;
            margin-top: 10px;
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        .scale-controls {
            margin: 10px;
        }

        .slider-container {
            display: inline-block;
            margin: 10px;
        }

        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <div class="first-block">
        <div class="navigation-pannel">
            <!-- Ваши навигационные элементы -->
        </div>
    </div>

    <div class="second-block">
        <div class="gallery-container">
            <div id="current-image-container" class="gallery">
                <img id="current-image" class="terem-muhi-book-title" src="/api/image/0" alt="Обложка">
                <div id="current-desc" class="desc">Обложка книги "Терем Мухи"</div>
            </div>

            <div class="controls">
                <button id="prev-btn">Предыдущее</button>
                <span id="current-index">1 / 10</span>
                <button id="next-btn">Следующее</button>
            </div>

            <div class="scale-controls">
                <span>Масштаб:</span>
                <div class="slider-container">
                    <input type="range" id="scale-slider" min="0.5" max="2" step="0.1" value="1">
                    <span id="scale-value">1.0x</span>
                </div>
            </div>
        </div>
    </div>

    <footer class="end-of-page">
        <!-- Ваш футер -->
    </footer>

    <script>
        // Данные о галерее
        const imageDescriptions = [
            { src: '/api/image/0?scale=1', alt: 'Обложка', desc: 'Обложка книги "Терем Мухи"' },
            { src: '/api/image/1?scale=1', alt: 'Первая страница', desc: 'Первая страница' },
            { src: '/api/image/2?scale=1', alt: 'Вторая страница', desc: 'Вторая страница' },
            { src: '/api/image/3?scale=1', alt: 'Третья страница', desc: 'Третья страница' },
            { src: '/api/image/4?scale=1', alt: 'Четвертая страница', desc: 'Четвертая страница' },
            { src: '/api/image/5?scale=1', alt: 'Пятая страница', desc: 'Пятая страница' },
            { src: '/api/image/6?scale=1', alt: 'Шестая страница', desc: 'Шестая страница' },
            { src: '/api/image/7?scale=1', alt: 'Седьмая страница', desc: 'Седьмая страница' },
            { src: '/api/image/8?scale=1', alt: 'Восьмая страница', desc: 'Восьмая страница' },
            { src: '/api/image/9?scale=1', alt: 'Девятая страница', desc: 'Девятая страница' }
        ];

        // Текущий индекс изображения
        let currentIndex = 0;
        const imageElement = document.getElementById('current-image');
        const descElement = document.getElementById('current-desc');
        const currentIndexElement = document.getElementById('current-index');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const scaleSlider = document.getElementById('scale-slider');
        const scaleValue = document.getElementById('scale-value');

        // Инициализация
        function init() {
            updateImage();
            updateIndexDisplay();

            // Назначаем обработчики событий
            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateImage();
                    updateIndexDisplay();
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentIndex < imageDescriptions.length - 1) {
                    currentIndex++;
                    updateImage();
                    updateIndexDisplay();
                }
            });

            scaleSlider.addEventListener('input', (event) => {
                const scale = parseFloat(event.target.value);
                scaleValue.textContent = `${scale}x`;
                updateImageScale();
            });

            // Двойной клик для сброса масштаба
            imageElement.addEventListener('dblclick', () => {
                scaleSlider.value = 1;
                scaleValue.textContent = '1.0x';
                updateImageScale();
            });
        }

        // Обновление изображения с учетом масштаба
        function updateImage() {
            const currentDesc = imageDescriptions[currentIndex];
            imageElement.src = currentDesc.src;
            descElement.textContent = currentDesc.desc;
        }

        // Обновление отображения номера текущего изображения
        function updateIndexDisplay() {
            currentIndexElement.textContent = `${currentIndex + 1} / ${imageDescriptions.length}`;
        }

        // Обновление изображения с учётом текущего масштаба
        function updateImageScale() {
            const scale = parseFloat(scaleSlider.value);
            const currentDesc = imageDescriptions[currentIndex];
            const index = currentIndex;
            const newPath = `${currentDesc.src.split('?')[0]}?scale=${scale}`;

            imageDescriptions[index].src = newPath;
            imageElement.src = newPath;
        }

        // События для прокрутки колесиком мыши
        imageElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            let newScale = parseFloat(scaleSlider.value) + delta;

            // Ограничиваем масштаб в пределах 0.5-2
            if (newScale < 0.5) newScale = 0.5;
            if (newScale > 2) newScale = 2;

            scaleSlider.value = newScale;
            scaleValue.textContent = `${newScale.toFixed(1)}x`;
            updateImageScale();
        });

        // Начальная инициализация
        init();
    </script>
</body>
</html>
