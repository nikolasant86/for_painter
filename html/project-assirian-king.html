<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ассирийский царь Асархадон</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="first-block">
    <div class="navigation-pannel">
        <nav class="navigation-pannel">
            <div class="in-navigation-pannel">
                <div class="logotip-button">
                    <a class="logotip" href="/">
                        ALYAKINA
                    </a>
                    <button class="menu-toggle" aria-label="Открыть меню">☰</button>
                    <div class="navigation-buttons">
                        <a class="projects-button" href="/#projects">ПРОЕКТЫ</a>
                        <a class="about-button" href="/#artist-statement">ОБО МНЕ</a>
                        <a class="catalog-button" href="/catalog.html">РАБОТЫ</a>
                        <a class="contacts-button" href="/#contacts">КОНТАКТЫ</a>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</div>
<div class="second-block">

    <div id="gallery-container">
        <p class="loading">loading images...</p>
    </div>
    
    <!-- МОДАЛЬНОЕ ОКНО — ПУСТОЕ ПРИ ЗАГРУЗКЕ, НЕ ОТКРЫВАЕТСЯ -->
    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="fullImage" alt="Увеличенное изображение" />
        <div class="loading" id="loadingIndicator">Загрузка...</div>
    </div>

    <!-- КНОПКИ УПРАВЛЕНИЯ -->
    <div class="controls" id="controls" style="display: none;">
        <button id="prevBtn">← Предыдущее</button>
        <button id="resetBtn">Сбросить масштаб</button>
        <button id="nextBtn">Следующее →</button>
    </div>

</div>
    
<script>
  const SERVER_URL = 'http://192.168.1.19:7996';
  const IMAGE_API = `${SERVER_URL}/api/v4/images`;
  const IMAGE_ENDPOINT = `${SERVER_URL}/api/v4/image/`;
  const MAX_SCALE = 3.0;
  const MIN_SCALE = 0.1;
  const SCALE_STEP = 0.1;

  let currentImageIndex = 0;
  let currentScale = 1.0;
  let imageFiles = [];

  const modal = document.getElementById("myModal");
  const modalImg = document.getElementById("fullImage");
  const closeBtn = document.getElementsByClassName("close")[0];
  const controls = document.getElementById("controls");
  const galleryContainer = document.getElementById("gallery-container");
  const loadingIndicator = document.getElementById("loadingIndicator");

  // ✅ НИКАКИХ ВЫЗОВОВ openModal() ЗДЕСЬ — ТОЛЬКО ПО КЛИКУ!
  async function loadImages() {
    try {
      const response = await fetch(IMAGE_API);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      imageFiles = data.images || [];

      if (imageFiles.length === 0) {
        galleryContainer.innerHTML = '<p style="color: #ccc; text-align: center;">Изображения не найдены.</p>';
        return;
      }

      // ✅ Центрирование миниатюр — все изображения по центру
      galleryContainer.innerHTML = imageFiles.map((filename, index) => `
        <img src="${SERVER_URL}/images/${filename}?scale=0.3" alt="Фото ${index + 1}" />
      `).join('');

      // Добавляем обработчики кликов — ТОЛЬКО ПО КЛИКУ
      document.querySelectorAll('#gallery-container img').forEach((img, index) => {
        img.onclick = () => openModal(index);
      });

      controls.style.display = 'flex';

    } catch (error) {
      console.error('Ошибка загрузки изображений:', error);
      galleryContainer.innerHTML = '<p style="color: red; text-align: center;">Не удалось загрузить изображения. Проверьте сервер.</p>';
    } finally {
      document.querySelector('.loading')?.remove();
    }
  }

  // ✅ ОТКРЫВАЕМ ТОЛЬКО ПО КЛИКУ — НИКАКИХ АВТОМАТИЧЕСКИХ ВЫЗОВОВ!
  function openModal(index) {
    currentImageIndex = index;
    currentScale = 1.0;
    modal.style.display = "flex"; // ✅ ОТКРЫВАЕМ ТОЛЬКО ПРИ КЛИКЕ
    fetchAndDisplayImage(index);
  }

  async function fetchAndDisplayImage(index) {
    loadingIndicator.style.display = 'block'; // Показываем индикатор
    modalImg.style.transform = `scale(${currentScale})`;

    try {
      const response = await fetch(`${IMAGE_ENDPOINT}${index}`);
      if (!response.ok) throw new Error(`Ошибка загрузки: ${response.status}`);

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      modalImg.src = url;
      document.title = `Земельный участок — ${imageFiles[index]}`;

    } catch (error) {
      console.error('Ошибка загрузки изображения:', error);
      alert(`Ошибка загрузки изображения: ${error.message}`);
      modal.style.display = "none";
    } finally {
      loadingIndicator.style.display = 'none'; // Скрываем после загрузки
    }
  }

  // ✅ ЗАКРЫТИЕ ПО КЛИКУ НА КРЕСТИК ИЛИ НА ТЕМНУЮ ОБЛАСТЬ
  closeBtn.onclick = () => {
    modal.style.display = "none";
  };

  window.onclick = (event) => {
    if (event.target === modal) {
      modal.style.display = "none";
    }
  };

  // ✅ УПРАВЛЕНИЕ КЛАВИШАМИ
  document.onkeydown = (e) => {
    if (modal.style.display === "flex") {
      if (e.key === "ArrowRight") {
        currentImageIndex = (currentImageIndex + 1) % imageFiles.length;
        fetchAndDisplayImage(currentImageIndex);
      } else if (e.key === "ArrowLeft") {
        currentImageIndex = (currentImageIndex - 1 + imageFiles.length) % imageFiles.length;
        fetchAndDisplayImage(currentImageIndex);
      }
    }
  };

  // ✅ МАСШТАБИРОВАНИЕ КОЛЕСОМ
  modal.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.deltaY > 0) {
      currentScale = Math.max(MIN_SCALE, currentScale - SCALE_STEP);
    } else {
      currentScale = Math.min(MAX_SCALE, currentScale + SCALE_STEP);
    }
    modalImg.style.transform = `scale(${currentScale})`;
  });

  // ✅ КНОПКИ УПРАВЛЕНИЯ
  document.getElementById("prevBtn").onclick = () => {
    currentImageIndex = (currentImageIndex - 1 + imageFiles.length) % imageFiles.length;
    fetchAndDisplayImage(currentImageIndex);
  };

  document.getElementById("nextBtn").onclick = () => {
    currentImageIndex = (currentImageIndex + 1) % imageFiles.length;
    fetchAndDisplayImage(currentImageIndex);
  };

  document.getElementById("resetBtn").onclick = () => {
    currentScale = 1.0;
    modalImg.style.transform = `scale(${currentScale})`;
  };

  // ✅ ЗАГРУЗКА ТОЛЬКО ПРИ ЗАГРУЗКЕ СТРАНИЦЫ — НИКАКОГО openModal()
  window.onload = () => {
    loadImages();
    // ✅ НИКАКИХ ДОПОЛНИТЕЛЬНЫХ ВЫЗОВОВ — НЕТ openModal(0) — НЕТ ОТКРЫТИЯ!
    // ✅ МОДАЛЬНОЕ ОКНО ОСТАЁТСЯ display: none — ГАРАНТИРОВАННО
  };
</script>

<footer class="end-of-page">
    <div class="footer-container">
        <div class="main-title-information">
            <div class="logotip-button">
                <a class="logotip" href="/">
                    ALYAKINA
                </a>
            </div>
            <div class="other-main-title-information">
                <p class="name-privicy-policy">
                    <i class="name-privicy-policy">© 2026 ALYAKINA. Все права защищены.</i>
                </p>
            </div>
        </div>
    </div>
</footer>

</body>
</html>
