services:
  nginx:
    image: nginx:1.30.2-alpine
    container_name: nginx
    ports:
      - 80:80
    dns:
      - 8.8.8.8      # Google DNS
      - 1.1.1.1      # Cloudflare DNS
    networks:
      - logging-network
    volumes:
      - /etc/nginx:/etc/nginx
      - /var/log/nginx:/var/log/nginx
      - /home/nikolay/projects/for_painter/html:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '256M'
  
  gallery:
    image: nikolavasant/gallery:1.33
    container_name: gallery
    ports:
      - 8000:8000
    networks:
      - logging-network
    volumes:
      - /var/log/apps/gallery:/var/log/gallery
      - /home/nikolay/projects/for_painter/html/nesessary/images/terem-muhi-book/images:/app/images
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '128M'

  gallery1:
    image: nikolavasant/gallery:1.34
    container_name: gallery
    ports:
      - 7999:7999
    networks:
      - logging-network
    volumes:
      - /var/log/apps/gallery:/var/log/gallery
      - /home/nikolay/projects/for_painter/html/nesessary/images/terem-muhi-book/images:/app/images
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '128M'

networks:
  logging-network:
    driver: bridge
